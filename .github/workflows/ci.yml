name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate framework and theme
        run: pnpm validate

      - name: Show exact Prettier patch for updated preview checks (temporary)
        if: failure()
        run: |
          pnpm exec prettier --write build-scripts/lib/doctor.js tests/doctor.test.js tests/package-smoke.js docs/LIQUID_JULY_2026_PREVIEW.md
          git --no-pager diff -- build-scripts/lib/doctor.js tests/doctor.test.js tests/package-smoke.js docs/LIQUID_JULY_2026_PREVIEW.md

  portability:
    name: portability (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build:clean

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Pack and install the published shape
        run: pnpm pack:check

  node-next:
    name: Node 26 canary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
