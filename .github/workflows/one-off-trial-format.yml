name: One-off developer trial formatting
on:
  push:
    branches: [docs/independent-developer-pilot]
    paths: [.github/workflows/one-off-trial-format.yml]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/independent-developer-pilot
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/DEVELOPER_TRIAL.md
      - name: Commit if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DEVELOPER_TRIAL.md
          git commit -m "style: format independent developer trial protocol"
          git push origin HEAD:docs/independent-developer-pilot
