name: One-off browser smoke formatting
on:
  push:
    branches: [test/opt-in-shopify-browser-acceptance]
    paths: [.github/workflows/one-off-browser-format.yml]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: test/opt-in-shopify-browser-acceptance
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write tests/shopify-browser-smoke.mjs
      - name: Commit if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/shopify-browser-smoke.mjs
          git commit -m "style: format optional storefront browser acceptance"
          git push origin HEAD:test/opt-in-shopify-browser-acceptance
