name: One-off doctor formatting
on:
  push:
    branches: [feat/doctor-actionable-json]
    paths: [.github/workflows/one-off-doctor-format.yml]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/doctor-actionable-json
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write build-scripts/lib/doctor.js tests/doctor.test.js
      - name: Push formatted changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-scripts/lib/doctor.js tests/doctor.test.js
          git commit -m "style: format doctor diagnostics and tests"
          git push origin HEAD:feat/doctor-actionable-json
