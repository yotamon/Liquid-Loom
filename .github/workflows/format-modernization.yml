name: Format modernization branch

on:
  push:
    branches: [feat/modernize-shopify-2026]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/modernize-shopify-2026
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - name: Commit formatted output and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/format-modernization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format Shopify modernization changes"
          git push origin HEAD:feat/modernize-shopify-2026
