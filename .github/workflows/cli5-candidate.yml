name: Shopify CLI 5 candidate evaluation (temporary)

on:
  push:
    branches:
      - feat/shopify-cli-5-compatibility

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - name: Resolve CLI 5 dependency graph without modifying repository
        run: pnpm install --frozen-lockfile
      - name: Validate Shopify CLI 5 with the reference theme
        run: |
          pnpm exec shopify version
          pnpm validate
