name: Build Shopify deployment branch

on:
  workflow_dispatch:
    inputs:
      reconciled_deployment_changes:
        description: I reviewed external deployment-branch edits and reconciled any wanted changes into source
        required: false
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: shopify-theme-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate

      - name: Prepare compiled branch
        shell: bash
        env:
          RECONCILED_DEPLOYMENT_CHANGES: ${{ inputs.reconciled_deployment_changes }}
        run: |
          set -euo pipefail
          deploy_dir="$RUNNER_TEMP/shopify-production"
          if git ls-remote --exit-code --heads origin shopify-production >/dev/null 2>&1; then
            git fetch origin shopify-production:refs/remotes/origin/shopify-production
            git worktree add --detach "$deploy_dir" origin/shopify-production

            # A fast-forward push alone does NOT prevent replacement of Shopify-originated
            # files. Detect an external latest commit before modifying the worktree.
            latest_subject="$(git -C "$deploy_dir" log -1 --format=%s)"
            latest_author="$(git -C "$deploy_dir" log -1 --format=%ae)"
            generated_author="41898282+github-actions[bot]@users.noreply.github.com"
            if [[ "$latest_subject" != "Deploy Shopify theme from "* || "$latest_author" != "$generated_author" ]]; then
              if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" || "$RECONCILED_DEPLOYMENT_CHANGES" != "true" ]]; then
                echo "::error::shopify-production has commits not generated by Liquid Loom. Review Shopify changes, reconcile source, then use the explicit manual override if appropriate."
                exit 1
              fi
              echo "::warning::Explicit manual reconciliation acknowledged; replacing compiled theme files."
            fi
          else
            git worktree add --detach "$deploy_dir" HEAD
            find "$deploy_dir" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi

          for directory in assets blocks config layout locales sections snippets templates; do
            rm -rf "$deploy_dir/$directory"
            if [ -d "dist/theme/$directory" ]; then
              cp -R "dist/theme/$directory" "$deploy_dir/$directory"
            fi
          done

          # Shopify CLI 4.8.4+ and GitHub sync preserve optional theme-root agent context.
          for context_file in AGENTS.md DESIGN.md; do
            rm -f "$deploy_dir/$context_file"
            if [ -f "dist/theme/$context_file" ]; then
              cp "dist/theme/$context_file" "$deploy_dir/$context_file"
            fi
          done

          git -C "$deploy_dir" checkout -B shopify-production
          git -C "$deploy_dir" config user.name "github-actions[bot]"
          git -C "$deploy_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$deploy_dir" add -A
          if git -C "$deploy_dir" diff --cached --quiet; then
            echo "No deployable theme changes."
            exit 0
          fi
          git -C "$deploy_dir" commit -m "Deploy Shopify theme from ${GITHUB_SHA}"
          git -C "$deploy_dir" push origin HEAD:shopify-production
